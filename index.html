<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Augmenting RPL with the 7 Learning Spaces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Define brand colours as CSS variables */
        :root {
            --brand-pink: #e72582;
            --brand-light-grey: #abb5bf;
            --brand-dark-blue: #1f2a52;
            --brand-cyan: #00bec7;
            --brand-light-cyan: #d2f0f0; 
            --brand-white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-light-cyan);
        }

        /* Custom styles using brand colours */
        .header-bg { background-color: var(--brand-dark-blue); }
        .header-text { color: var(--brand-white); }
        .accent-text { color: var(--brand-pink); }
        .card-bg { background-color: var(--brand-white); }
        .card-border { border-left-color: var(--brand-pink); }
        .question-bg { background-color: #f8f8f8; }
        .question-text { color: var(--brand-dark-blue); }
        .question-strong { color: var(--brand-dark-blue); }
        .icon-color { color: var(--brand-cyan); }

        /* Accordion styles */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
        }

        .accordion-button.active .arrow {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="antialiased">

    <div class="min-h-screen">
        <!-- Header -->
        <header class="header-bg shadow-md">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <h1 class="text-3xl font-bold header-text">Augmenting RPL with the 7 Learning Spaces</h1>
                <p class="text-gray-300 mt-1">Using AI to generate evidence for Recognition of Prior Learning (RPL) based on Ewan McIntosh's model.</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <p class="text-xl text-gray-800 font-semibold mb-6 mt-4">This model reimagines how candidates can provide evidence by leveraging different learning environments, augmented by AI.</p>

            <div id="accordion-container" class="space-y-4">
                <!-- Accordion items will be injected here by JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // Data structured around Ewan McIntosh's 7 Learning Spaces
        const learningSpaces = [
            {
                title: "Secret Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>`,
                description: "Private, individualised spaces for self-directed reflection. AI can act as a confidential coach, helping candidates articulate their experiences and turn tacit knowledge into explicit evidence.",
                examples: [
                    "<strong>AI Reflective Partner (Feed-Up, Feed-Back, Feed-Forward - Ruud Duvecot - CAMPLUS):</strong> The candidate uses a structured reflective tool where an AI partner prompts them to define a project goal (Feed-Up), describe the actions they took to achieve it (Feed-Back), and articulate what lessons they will carry into future projects (Feed-Forward).",
                    "<strong>Socratic Reflection Agent:</strong> An AI agent delves into a candidate's work experience, asking probing questions about great personal experiences on the job relevant to a specific unit of competency, showcasing their problem-solving and conceptual thinking.",
                    "<strong>Traditional Journaling:</strong> Candidates can still use a private diary or journal for reflection, which can later be reviewed with a human assessor to extract evidence."
                ],
                question: "How can we ensure that AI prompting in a Secret Space enhances, rather than influences, the candidate's authentic reflection?"
            },
            {
                title: "Group Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-4.67c.625.93.94 2.053.94 3.21v.003zM12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>`,
                description: "Collaborative environments where knowledge is built together. The challenge for RPL is isolating an individual's contribution. AI can analyse communication and project data to solve this.",
                examples: [
                    "<strong>Collaboration Analytics:</strong> A candidate submits chat logs from a team project (e.g., Slack or Teams). An AI analyses the logs to quantify the candidate's specific contributions, leadership moments, and problem-solving inputs.",
                    "<strong>Blended Group Project:</strong> A candidate participates in a real-world group project, with a human observer noting their collaborative skills and contributions as evidence.",
                    "<strong>Meeting Transcript Analysis:</strong> AI processes a recorded meeting transcript to highlight instances where the candidate demonstrated key communication or negotiation skills required by the qualification."
                ],
                question: "What ethical frameworks are needed to analyse group communications for individual assessment without violating the privacy of other team members?"
            },
            {
                title: "Publishing Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>`,
                description: "Where learners create and share content. For RPL, these are artifacts of work. AI can help map these artifacts to criteria and provide feedback before submission.",
                examples: [
                    "<strong>Automated Criteria Mapping:</strong> A candidate uploads a project report. An AI scans the document and automatically highlights sections that align with specific qualification criteria, creating a preliminary evidence map.",
                    "<strong>AI Writing Assistant:</strong> An AI provides real-time feedback on the clarity, tone, and structure of a candidate's written portfolio, ensuring it meets professional standards.",
                    "<strong>Portfolio Submission:</strong> The traditional method where a candidate compiles and submits a portfolio of their work (e.g., reports, designs, presentations) for an assessor to review."
                ],
                question: "If AI assists in creating and mapping the evidence, how can assessors be sure the final work truly represents the candidate's own competence?"
            },
            {
                title: "Performing Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 016 0v8.25a3 3 0 01-3 3z" /></svg>`,
                description: "Environments where learners actively demonstrate skills. AI can create safe, repeatable simulation environments for candidates to perform tasks and generate evidence.",
                examples: [
                    "<strong>AI-Powered Role-Play:</strong> The candidate enters a simulated environment to handle a difficult customer conversation. The AI plays the role of the customer, and the system records and scores the candidate's performance against communication metrics.",
                    "<strong>Live Observation (F2F):</strong> An assessor observes the candidate performing a practical task in their actual workplace, providing a traditional and highly authentic form of evidence.",
                    "<strong>Video Submission Analysis:</strong> A candidate records themselves completing a technical task. AI analyses the video to check for procedural accuracy, safety compliance, and overall efficiency."
                ],
                question: "How can we ensure AI simulations are nuanced enough to assess the complex, unscripted human interactions often required in performance tasks?"
            },
            {
                title: "Participation Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zm-7.518-.267A8.25 8.25 0 1120.25 10.5M8.288 14.212A5.25 5.25 0 1117.25 10.5" /></svg>`,
                description: "Live, synchronous events where learning is about active involvement. For RPL, this space can be used for verification through dialogue and questioning.",
                examples: [
                    "<strong>Socratic Verification Interview:</strong> An AI conducts a recorded Q&A session with the candidate about a piece of evidence they submitted. The AI uses probing questions to confirm the depth of their understanding and ability to apply knowledge.",
                    "<strong>Assessor Interview:</strong> A one-on-one professional discussion between the candidate and a human assessor, allowing for a deep dive into the candidate's experience and expertise.",
                    "<strong>Webinar Q&A Session:</strong> The candidate participates in a live webinar where they must answer questions from an expert panel, demonstrating their ability to think on their feet."
                ],
                question: "What trust frameworks are needed before an AI-led verification interview can be considered a reliable proxy for a conversation with a human assessor?"
            },
            {
                title: "Data Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>`,
                description: "Spaces focused on interpreting information and finding insights. AI can analyse candidate-submitted data to identify patterns of competence and create powerful summaries for assessors.",
                examples: [
                    "<strong>Skills Checklist Analysis:</strong> A candidate completes a self-assessment checklist. The AI analyses the quantitative scores and generates a qualitative report, highlighting areas of strength and suggesting what evidence could be used to support those claims.",
                    "<strong>Spreadsheet Analysis:</strong> A candidate submits a project budget spreadsheet. The AI analyses the formulas, data, and structure to verify the candidate's financial literacy and data management skills.",
                    "<strong>Workplace Data Review:</strong> The candidate provides performance dashboards or reports from their job, which are then reviewed by a human assessor to find evidence of competence."
                ],
                question: "How do we ensure that AI-driven analysis of data is accurate, unbiased, and doesn't misinterpret the context behind the numbers?"
            },
            {
                title: "Watching Spaces",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mr-4 icon-color flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" /></svg>`,
                description: "Environments for consuming content. For RPL, this is about identifying knowledge gaps and providing targeted resources. AI can personalise this process and then verify comprehension.",
                examples: [
                    "<strong>Adaptive Learning Path:</strong> Based on an initial evidence review, an AI identifies a knowledge gap (e.g., a specific regulation). It then recommends a short video or article and follows up with a quiz to verify understanding, generating evidence that the gap has been filled.",
                    "<strong>Video Comprehension Test:</strong> A candidate watches a video on company policy. Afterwards, an AI chatbot asks contextual questions to confirm they not only watched it but understood its implications.",
                    "<strong>Prescribed Reading:</strong> An assessor identifies a knowledge gap and asks the candidate to read a specific document or manual, followed by a discussion to confirm their understanding."
                ],
                question: "Does verifying comprehension of 'watched' content truly count as evidence of prior learning, or is it simply new learning within the RPL process?"
            }
        ];

        const accordionContainer = document.getElementById('accordion-container');

        // Function to create and append accordion items
        learningSpaces.forEach((space, index) => {
            // Create accordion item container
            const item = document.createElement('div');
            item.className = 'card-bg border-l-4 card-border shadow-sm rounded-r-md';
            
            // Create button for the accordion
            const button = document.createElement('button');
            button.className = 'accordion-button w-full text-left p-4 focus:outline-none';
            button.setAttribute('aria-expanded', 'false');
            button.innerHTML = `
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        ${space.icon}
                        <h2 class="text-xl font-semibold text-gray-800">${space.title}</h2>
                    </div>
                    <svg class="arrow w-6 h-6 text-gray-600 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            `;

            // Create content div
            const content = document.createElement('div');
            content.className = 'accordion-content px-4';
            content.innerHTML = `
                <div class="pb-4">
                    <p class="text-gray-600">${space.description}</p>
                    <h3 class="font-semibold text-gray-800 mt-4 mb-2">AI & Blended Evidence Examples:</h3>
                    <ul class="list-disc list-inside space-y-1 text-gray-700">
                        ${space.examples.map(ex => `<li>${ex}</li>`).join('')}
                    </ul>
                    <div class="mt-6 p-4 rounded-md question-bg border border-gray-200">
                        <p class="question-text"><strong class="question-strong">Challenge for RPL Experts:</strong> ${space.question}</p>
                    </div>
                </div>
            `;

            // Append button and content to the item
            item.appendChild(button);
            item.appendChild(content);

            // Append the item to the main container
            accordionContainer.appendChild(item);

            // Add click event listener
            button.addEventListener('click', () => {
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                
                // This logic handles one-at-a-time accordion expansion.
                const currentlyActiveButton = document.querySelector('.accordion-button.active');
                if (currentlyActiveButton && currentlyActiveButton !== button) {
                    currentlyActiveButton.setAttribute('aria-expanded', 'false');
                    currentlyActiveButton.classList.remove('active');
                    currentlyActiveButton.nextElementSibling.style.maxHeight = null;
                }

                // Then, it toggles the clicked item.
                if (isExpanded) {
                    button.setAttribute('aria-expanded', 'false');
                    button.classList.remove('active');
                    content.style.maxHeight = null;
                } else {
                    button.setAttribute('aria-expanded', 'true');
                    button.classList.add('active');
                    // Set max height dynamically to enable the smooth transition
                    content.style.maxHeight = content.scrollHeight + 'px';
                }
            });
        });
    </script>
</body>
</html>
